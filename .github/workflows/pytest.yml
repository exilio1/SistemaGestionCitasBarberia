name: Pytest

on:
  push:
    branches: [develop, testing, "testing/**", "testing-*"]
  pull_request:
    branches: [develop, testing]

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest --cov=app.core --cov=app.models --cov-report=term-missing
