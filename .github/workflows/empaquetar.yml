# este workflow empaqueta la app para Windows y macOS usando PyInstaller
# se ejecuta manualmente desde la pestaña Actions de GitHub
# al terminar sube los ejecutables directamente al release v1.0.0

name: empaquetar ejecutables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'version a empaquetar (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'

# permiso necesario para que el workflow pueda subir archivos al release
permissions:
  contents: write

jobs:
  empaquetar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
          - os: macos-latest
            plataforma: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: configurar python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: instalar las librerias necesarias para empaquetar
        run: pip install customtkinter Pillow bcrypt python-dotenv pyinstaller

      # ── Windows: genera un solo .exe ──────────────────────────────────────
      - name: empaquetar para windows
        if: matrix.plataforma == 'windows'
        run: >
          pyinstaller
          --windowed
          --onefile
          --collect-all customtkinter
          --collect-submodules app
          --name BarberStudio
          app/main.py

      - name: subir ejecutable windows al release
        if: matrix.plataforma == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS: genera un .app dentro de una carpeta y lo comprime en zip ─
      - name: empaquetar para macos
        if: matrix.plataforma == 'macos'
        run: >
          pyinstaller
          --windowed
          --onedir
          --collect-all customtkinter
          --collect-submodules app
          --name BarberStudio
          app/main.py

      - name: comprimir la app de macos en zip
        if: matrix.plataforma == 'macos'
        run: cd dist && zip -r BarberStudio-macOS.zip BarberStudio.app

      - name: subir zip macos al release
        if: matrix.plataforma == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
