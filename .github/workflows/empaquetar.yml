# este workflow empaqueta la app para Windows y macOS usando PyInstaller
# se ejecuta manualmente desde la pestaña Actions de GitHub
# al terminar sube los ejecutables directamente al release indicado

name: empaquetar ejecutables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'version a empaquetar (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'

# permiso necesario para que el workflow pueda subir archivos al release
permissions:
  contents: write

jobs:
  empaquetar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
          - os: macos-latest
            plataforma: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: configurar python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: instalar las librerias necesarias para empaquetar
        run: pip install -r requirements.txt pyinstaller

      # crea el archivo .env con el token del bot para que funcione al descargar
      - name: crear el archivo .env con la configuracion del bot
        shell: bash
        run: |
          cat > .env << EOF
          APP_NAME=Sistema de Gestion Integral de Citas
          APP_ENV=production
          DB_PATH=data/barberia.db
          BACKUP_DIR=data/backups
          HORARIO_INICIO=08:00
          HORARIO_FIN=19:00
          PORCENTAJE_EMPLEADO=60
          PORCENTAJE_NEGOCIO=40
          BOT_PROVIDER=telegram
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ENABLED=true
          BCRYPT_ROUNDS=12
          MAX_RESPONSE_TIME=2
          EOF

      # usa el archivo .spec que tiene todos los modulos dinamicos listados explicitamente
      - name: empaquetar con pyinstaller usando el archivo spec
        run: pyinstaller barber_studio.spec

      # ── Windows: crea zip con el ejecutable y el .env ─────────────────────
      - name: comprimir ejecutable y configuracion para windows
        if: matrix.plataforma == 'windows'
        shell: bash
        run: |
          cp .env dist/BarberStudio/.env
          cd dist && powershell Compress-Archive -Path BarberStudio -DestinationPath BarberStudio-Windows.zip || zip -r BarberStudio-Windows.zip BarberStudio

      - name: subir zip windows al release
        if: matrix.plataforma == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS: firma, crea launcher, incluye .env y comprime ─────────────
      - name: firmar la app con firma local para macos
        if: matrix.plataforma == 'macos'
        run: codesign --force --deep --sign - dist/BarberStudio.app

      - name: crear script de apertura para macos
        if: matrix.plataforma == 'macos'
        run: |
          cat > dist/Abrir_BarberStudio.command << 'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -cr "$DIR/BarberStudio.app"

          # Exportamos las variables del .env para que la app las herede
          if [ -f "$DIR/.env" ]; then
            while IFS= read -r linea; do
              [[ "$linea" =~ ^#.*$ || -z "$linea" ]] && continue
              export "$linea"
              launchctl setenv "${linea%%=*}" "${linea#*=}" 2>/dev/null
            done < "$DIR/.env"
          fi

          # Ejecutamos el binario directamente para que herede las variables
          "$DIR/BarberStudio.app/Contents/MacOS/BarberStudio" &
          disown $!
          SCRIPT
          chmod +x dist/Abrir_BarberStudio.command

      - name: comprimir app launcher y configuracion en zip
        if: matrix.plataforma == 'macos'
        run: |
          cp .env dist/.env
          cd dist && zip -r BarberStudio-macOS.zip BarberStudio.app Abrir_BarberStudio.command .env

      - name: subir zip macos al release
        if: matrix.plataforma == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
