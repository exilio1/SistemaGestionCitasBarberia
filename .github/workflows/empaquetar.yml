# este workflow empaqueta la app para Windows y macOS usando PyInstaller
# se ejecuta manualmente desde la pestaña Actions de GitHub
# al terminar sube los ejecutables directamente al release indicado

name: empaquetar ejecutables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'version a empaquetar (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'

# permiso necesario para que el workflow pueda subir archivos al release
permissions:
  contents: write

jobs:
  empaquetar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
          - os: macos-latest
            plataforma: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: configurar python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: instalar las librerias necesarias para empaquetar
        run: pip install customtkinter Pillow bcrypt python-dotenv pyinstaller

      # usa el archivo .spec que tiene todos los modulos dinamicos listados explicitamente
      - name: empaquetar con pyinstaller usando el archivo spec
        run: pyinstaller barber_studio.spec

      # ── Windows: sube el .exe del release ────────────────────────────────
      - name: subir ejecutable windows al release
        if: matrix.plataforma == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio/BarberStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS: firma, crea launcher y comprime en zip ─────────────────────
      - name: firmar la app con firma local para macos
        if: matrix.plataforma == 'macos'
        run: codesign --force --deep --sign - dist/BarberStudio.app

      - name: crear script de apertura para macos
        if: matrix.plataforma == 'macos'
        run: |
          cat > dist/Abrir_BarberStudio.command << 'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -cr "$DIR/BarberStudio.app"
          open "$DIR/BarberStudio.app"
          SCRIPT
          chmod +x dist/Abrir_BarberStudio.command

      - name: comprimir app y launcher en zip
        if: matrix.plataforma == 'macos'
        run: cd dist && zip -r BarberStudio-macOS.zip BarberStudio.app Abrir_BarberStudio.command

      - name: subir zip macos al release
        if: matrix.plataforma == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/BarberStudio-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
